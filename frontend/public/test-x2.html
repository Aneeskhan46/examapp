<!DOCTYPE html>
<html>
<head>
<script src="http://localhost:5173/node_modules/mathlive/dist/mathlive.mjs" type="module"></script>
</head>
<body>
<h3>Test 1: Long Top, Short Bottom</h3>
<math-field id="mf1"></math-field>
<h3>Test 2: Short Top, Long Bottom</h3>
<math-field id="mf2"></math-field>

<script type="module">
  customElements.whenDefined('math-field').then(() => {
    document.getElementById('mf1').value = '\\xleftrightarrows[SHORT]{LONG LONG LONG LONG LONG}';
    document.getElementById('mf2').value = '\\xleftrightarrows[LONG LONG LONG LONG LONG]{SHORT}';
  });
</script>
</body>
</html>
